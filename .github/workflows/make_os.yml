name: make_os

on:
# push:
#   branches: [ master ]
#   paths:
#     - '.github/workflows/make_os.yml'
# schedule:
#   - cron: '00 15 * * 6'
#     timezone: "Etc/GMT-9"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
  queue: single

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    if: github.repository != 'freetz-ng/freetz-ng' || github.event_name == 'workflow_dispatch'
    outputs:
      name: ${{ steps.vars.outputs.name }}

    steps:
      - name: vars
        id: vars
        run: |
          echo "name=$(date '+make_os-%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.vars.outputs.name }}
          name: ${{ steps.vars.outputs.name }}
          commit: ${{ github.sha }}
          body: These files are internally used!
          draft: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    permissions:
      packages: read
      contents: write
    container:
#     image: ghcr.io/freetz-ng/internal/firmware
      image: docker.io/${{ matrix.docker }}
#     credentials:
#       username: ${{ github.actor }}
#       password: ${{ secrets.FREETZ_DLTOKEN || secrets.GITHUB_TOKEN }}
#     options: --user 1001:1001
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        docker:
          - fedora:43
          - fedora:44
          - fedora:45
          - debian:bookworm
          - debian:trixie
          - debian:forky
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    name: "${{ matrix.docker }} - ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }}"
    runs-on: "${{ matrix.runner }}"
    if: github.repository != 'freetz-ng/freetz-ng' || github.event_name == 'workflow_dispatch'

    steps:

#     - name: sleep
#       run: |
#         SLEEP="$((1 + $(od -A n -t d -N 2 /dev/urandom | tr -d ' ') % 9))"
#         echo "Sleeping $SLEEP seconds ..."
#         sleep $SLEEP

#     - name: myips
#       run: |
#         echo -n "IP: " ; wget -q https://ipaddress.ai    -O - || echo none
#         echo -n "V4: " ; wget -q https://ipaddress.ai -4 -O - || echo none
#         echo -n "V6: " ; wget -q https://ipaddress.ai -6 -O - || echo none

      - name: preclone
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: ${{ github.workspace }}
          sparse-checkout: |
            tools/prerequisites
          sparse-checkout-cone-mode: false

      - name: install_prepare
        run: |
          if [ -x "$(command -v apt)" ]; then
          mkdir -p /etc/apt/mirrors
          cat > /etc/apt/mirrors/ubuntu.list <<'EOF'
          http://mirror.leaseweb.com/ubuntu	priority:1
          http://ubuntu.anexia.at/ubuntu	priority:2
          http://mirrors.dotsrc.org/ubuntu	priority:3
          EOF
          cat > /etc/apt/mirrors/ubuntu-ports.list <<'EOF'
          http://mirror.leaseweb.com/ubuntu-ports	priority:1
          http://ubuntu.anexia.at/ubuntu-ports	priority:2
          http://mirrors.dotsrc.org/ubuntu-ports	priority:3
          EOF
          (sed -E -i 's#http://[^[:space:]]*ubuntu\.com/ubuntu-ports#mirror+file:///etc/apt/mirrors/ubuntu-ports.list#g' /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2> /dev/null || true) && \
          (sed -E -i 's#http://[^[:space:]]*ubuntu\.com/ubuntu#mirror+file:///etc/apt/mirrors/ubuntu.list#g'             /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2> /dev/null || true)
          fi

      - name: install
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./tools/prerequisites install -y

      - name: locale
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if   [ -x "$(command -v apt)" ]; then
            apt-get update && apt-get install -y locales;
            if grep -q '^ID=ubuntu' /etc/os-release; then
              locale-gen en_US.utf8 && locale-gen de_DE.UTF-8 && update-locale;
            elif grep -q '^ID=debian' /etc/os-release; then
              sed -i 's/^# *en_US\.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen && \
              sed -i 's/^# *de_DE\.UTF-8 UTF-8/de_DE.UTF-8 UTF-8/' /etc/locale.gen && \
              locale-gen;
            fi
            if ls --version 2>&1 | grep -q 'uutils'; then
              apt-get remove -y --allow-remove-essential coreutils-from-uutils
            fi
          elif [ -x "$(command -v dnf)" ]; then
            dnf -y install glibc-locale-source && \
            localedef -i en_US -f UTF-8 en_US.UTF-8 && localedef -i de_DE -f UTF-8 de_DE.UTF-8;
          fi

      - name: clone
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          set-safe-directory: true
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: ${{ github.workspace }}
          fetch-depth: 0

      - name: cache_load
        uses: actions/cache/restore@v6
        if: always()
        with:
          path: |
            dl/*
            !dl/linux-*.tar.xz
            !dl/*-freetz-*-shared-glibc.tar.lzma
          key: make_cache
          restore-keys: make_cache

      - name: config
        run: |
          truncate -s0                                                                                   .config
          echo 'FREETZ_MODULES_OWN=""'                                                                >> .config
          for x in  UDEVMOUNT                                          ; do echo "FREETZ_PATCH_$x=y"  >> .config; done
          for x in  dummy loop usbserial                              ; do echo "FREETZ_MODULE_$x=y"  >> .config; done
          for x in  LDD DROPBEAR DNSMASQ                             ; do echo "FREETZ_PACKAGE_$x=y"  >> .config; done
          for x in  COMPRESSED  UNCOMPRESSED                        ; do echo "FREETZ_SIZEINFO_$x=y"  >> .config; done
          echo '# FREETZ_TOOLCHAIN_CCACHE is not set'                                                 >> .config
          echo 'FREETZ_VERBOSITY_FWMOD_0=y'                                                           >> .config
          echo 'FREETZ_VERBOSITY_LEVEL_0=y'                                                           >> .config
          echo 'FREETZ_VERBOSITY_LEVEL=0'                                                             >> .config
          echo 'FREETZ_SERIES_ALL=y'                                                                  >> .config
          echo 'FREETZ_DL_SITE_USER="https://github.com/Freetz-NG/dl-mirror/releases/download/dl"'    >> .config
          echo 'FREETZ_REPRODUCIBLE=y'                                                                >> .config
          echo '# FREETZ_FWMOD_SIGN is not set'                                                       >> .config
          echo '# FREETZ_DOWNLOAD_TOOLCHAIN is not set'                                               >> .config
          echo '# FREETZ_HOSTTOOLS_DOWNLOAD is not set'                                               >> .config
          echo "##########################################################" && echo -n "Lines=" && wc -l .config

      - name: useradd
        run: |
          groupadd freetz -o -g 1001
          useradd freetz -o -s $(which bash) -d $(pwd) -M -u 1001 -g 1001
          chown -R freetz:freetz $(pwd)

      - name: generate
        env:
          FREETZ_DLTOKEN: ${{ secrets.FREETZ_DLTOKEN }}
        run: |
          su --preserve-environment freetz -c '
            make
            rm -f images/latest.image
          '

      - name: rename
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          MATRIX_DOCKER: ${{ matrix.docker }}
          MATRIX_ARCH: ${{ runner.arch }}
        working-directory: ${{ github.workspace }}/images
        run: |
          MATRIX_DOCKER_NAME="$(echo "${MATRIX_DOCKER}" | tr ':' '-')"
          for x in *; do
            mv -v "$x" "$(date '+%Y-%m-%d')-${MATRIX_DOCKER_NAME}-${MATRIX_ARCH}-${GITHUB_RUN_ID}.${x##*.}"
          done

      - name: result
        run: |
          echo "##########################################################"
          ls -l images/
          sha256sum images/*

      - name: release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare.outputs.name }}
          name: ${{ needs.prepare.outputs.name }}
          body: These files are internally used!
          draft: true
          prerelease: true
          allowUpdates: true
          removeArtifacts: false
          artifacts: "images/*.image"
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: false
          artifactErrorsFailBuild: false

