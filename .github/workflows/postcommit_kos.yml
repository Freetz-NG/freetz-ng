name: postcommit_kos

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/postcommit_kos.yml'
      - 'config/.kos/generate.sh'
      - 'make/kernel/configs/avm/*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
  queue: single

jobs:
  build:
    permissions:
      packages: read
      contents: write
    runs-on: ubuntu-slim
    if: github.repository == 'freetz-ng/freetz-ng'

    steps:

#     - name: update
#       run: apt-get -y update && apt-get -y upgrade && apt-get -y dist-upgrade

      - name: install
        env:
          PACKAGES: git locales
        run: |
          missing=()
          for package in $PACKAGES; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed' || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo DEBIAN_FRONTEND=noninteractive apt-get -y install "${missing[@]}"
          fi

      - name: locale
        run: sudo $SHELL -c "locale-gen en_US.utf8 && locale-gen de_DE.UTF-8 && update-locale"

      - name: clone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git clone https://github-actions:$GITHUB_TOKEN@${GITHUB_SERVER_URL##*/}/$GITHUB_REPOSITORY.git $GITHUB_WORKSPACE
          git checkout $GITHUB_REF_NAME

      - name: generate
        run: |
          export LANG=en_US.utf8
          config/.kos/generate.sh

      - name: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git pull
          git add .
          git status
          git config --local user.name github-actions[bot]
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git diff --cached --quiet && exit 0 || git commit -m "kos: automatic update"
          git config --local credential.helper '!x() { echo "password=$GITHUB_TOKEN"; };x'
          git push origin $GITHUB_REF_NAME


