name: postcommit_docs

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/postcommit_docs.yml'
      - 'docs/generate.sh'
      - 'docs/*/generate.sh'
      - '!docs/stats/generate.sh'
      - 'make/host-tools/*/*.mk'
      - 'make/pkgs/*/Config.in'
      - 'make/pkgs/*/*.mk'
      - 'make/libs/*/Config.in'
      - 'make/libs/*/*.mk'
      - 'config/ui/patches.in'
      - 'config/ui/firmware.in'
      - 'docs/*/*.md'
      - 'docs/wiki/*/*.md'
      - 'docs/screenshots/*.png'
      - 'docs/screenshots/*.jpg'
      - 'docs/screenshots/*.gif'
      - 'docs/prerequisites/*.tpl'
      - 'tools/.prerequisites/*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
  queue: single

jobs:
  build:
    permissions:
      packages: read
      contents: write
    runs-on: ubuntu-slim
    if: github.repository == 'freetz-ng/freetz-ng'

    steps:

#     - name: update
#       run: apt-get -y update && apt-get -y upgrade && apt-get -y dist-upgrade

      - name: install
        env:
          PACKAGES: git locales imagemagick
        run: |
          missing=()
          for package in $PACKAGES; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed' || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo DEBIAN_FRONTEND=noninteractive apt-get -y install "${missing[@]}"
          fi

      - name: locale
        run: sudo $SHELL -c "locale-gen en_US.utf8 && locale-gen de_DE.UTF-8 && update-locale"

      - name: clone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git clone https://github-actions:$GITHUB_TOKEN@${GITHUB_SERVER_URL##*/}/$GITHUB_REPOSITORY.git $GITHUB_WORKSPACE
          git checkout $GITHUB_REF_NAME

      - name: generate
        run: |
          export LANG=en_US.utf8
          docs/generate.sh

      - name: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git pull || exit
          git add .
          git status
          git config --local user.name github-actions[bot]
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git diff --cached --quiet && exit 0 || git commit -m "docs: automatic update"
          git config --local credential.helper '!x() { echo "password=$GITHUB_TOKEN"; };x'
          git push origin $GITHUB_REF_NAME


