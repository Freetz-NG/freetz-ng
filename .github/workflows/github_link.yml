name: github_link

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/CHANGELOG.md'
# workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    permissions:
      packages: read
      contents: write
    runs-on: ubuntu-slim
    if: github.repository == 'freetz-ng/freetz-ng'

    steps:

#     - name: update
#       run: apt-get -y update && apt-get -y upgrade && apt-get -y dist-upgrade

      - name: install
        env:
          PACKAGES: git locales netcat-openbsd curl bsdmainutils xxd libarchive-zip-perl
        run: |
          missing=()
          for package in $PACKAGES; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed' || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo DEBIAN_FRONTEND=noninteractive apt-get -y install "${missing[@]}"
          fi

      - name: locale
        run: sudo $SHELL -c "locale-gen en_US.utf8 && locale-gen de_DE.UTF-8 && update-locale"

      - name: clone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git clone https://github-actions:$GITHUB_TOKEN@${GITHUB_SERVER_URL##*/}/$GITHUB_REPOSITORY.git $GITHUB_WORKSPACE
          git checkout $GITHUB_REF_NAME

      - name: generate
        id: generate
        run: |
          PKG="$(git log --format=%B -n1 ${{ github.sha }} | sed -nr 's/^(add|bump) ([^ ,]*).*/\2/p')"
          [ -z "$PKG" ] && echo "No add or bump." && exit
          echo "pkg=$PKG" >> $GITHUB_OUTPUT
          PKG="$(echo "$PKG" | tr '[:upper:]' '[:lower:]')"
          TYPE=""
          for x in make libs host-tools; do [ -e docs/$x/$PKG.md ] && TYPE=$x; done
          [ -z "$TYPE" ] && echo -n 'Waiting ' && for x in $(seq 60); do echo -n '.' && sleep 1; done && echo ' done.' && git pull
          for x in make libs host-tools; do [ -e docs/$x/$PKG.md ] && TYPE=$x; done
          [ -z "$TYPE" ] && PKG=$PKG-host
          for x in make libs host-tools; do [ -e docs/$x/$PKG.md ] && TYPE=$x; done
          [ -z "$TYPE" ] && echo "No page." && exit
          LINK="https://freetz-ng.github.io/freetz-ng/$TYPE/#$PKG"
          LINK="https://freetz-ng.github.io/freetz-ng/$TYPE/$PKG"
          echo "link=$LINK" >> $GITHUB_OUTPUT
          echo "################################################################" && bash -c "echo LINK=$LINK"

      - name: comment
        if: "contains(steps.generate.outputs.link, 'http')"
        uses: peter-evans/commit-comment@v4
        with:
          sha: ${{ github.sha }}
          body: |
            See for infos about ${{ steps.generate.outputs.pkg }} and maybe a changelog link:
            ${{ steps.generate.outputs.link }}


